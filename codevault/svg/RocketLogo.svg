
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="thrusterFire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9900" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#FFCC00" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFFF00" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="500" height="500" fill="#1A1D23" rx="0"/>
  <g id="rocket" transform="translate(250, 400)">
    <polygon points="-20,0 20,0 0,-100" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/>
    <polygon points="-15,-50 15,-50 0,-150" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="-10" y="-120" width="20" height="50" fill="#FFFFFF" rx="5"/>
    <g id="thruster">
      <polygon points="-10,-150 10,-150 0,-200" fill="url(#thrusterFire)" stroke="#FFFFFF" stroke-width="2"/>
      <polygon points="-5,-170 5,-170 0,-220" fill="url(#thrusterFire)" stroke="#FFFFFF" stroke-width="2"/>
    </g>
    <g id="flames">
      <ellipse cx="0" cy="-180" rx="20" ry="10" fill="url(#thrusterFire)" stroke="#FFFFFF" stroke-width="2"/>
      <ellipse cx="0" cy="-200" rx="15" ry="5" fill="url(#thrusterFire)" stroke="#FFFFFF" stroke-width="2"/>
    </g>
  </g>
</svg>
