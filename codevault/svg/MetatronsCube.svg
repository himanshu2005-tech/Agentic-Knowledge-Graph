<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-200 -200 400 400" width="400" height="400">
  <!-- MetatronsCube: Sacred Geometry -->
  <style>
    .circle {
      fill: none;
      stroke: #ffd700;
      stroke-width: 2;
      stroke-linecap: round;
    }
    .line {
      stroke: #ffd700;
      stroke-width: 1;
    }
  </style>
  <!-- Pitch-black background -->
  <rect x="-200" y="-200" width="400" height="400" fill="#000" />
  <!-- 13 overlapping circles -->
  <circle class="circle" cx="0" cy="0" r="100" />
  <circle class="circle" cx="86.6" cy="50" r="100" />
  <circle class="circle" cx="-86.6" cy="50" r="100" />
  <circle class="circle" cx="50" cy="86.6" r="100" />
  <circle class="circle" cx="-50" cy="86.6" r="100" />
  <circle class="circle" cx="50" cy="-86.6" r="100" />
  <circle class="circle" cx="-50" cy="-86.6" r="100" />
  <circle class="circle" cx="86.6" cy="-50" r="100" />
  <circle class="circle" cx="-86.6" cy="-50" r="100" />
  <circle class="circle" cx="0" cy="0" r="141.4" />
  <circle class="circle" cx="0" cy="0" r="70.7" />
  <circle class="circle" cx="0" cy="0" r="50" />
  <circle class="circle" cx="0" cy="0" r="35.4" />
  <!-- Connecting straight lines -->
  <line class="line" x1="0" y1="0" x2="100" y2="0" />
  <line class="line" x1="0" y1="0" x2="-100" y2="0" />
  <line class="line" x1="0" y1="0" x2="0" y2="100" />
  <line class="line" x1="0" y1="0" x2="0" y2="-100" />
  <line class="line" x1="0" y1="0" x2="86.6" y2="50" />
  <line class="line" x1="0" y1="0" x2="-86.6" y2="50" />
  <line class="line" x1="0" y1="0" x2="50" y2="86.6" />
  <line class="line" x1="0" y1="0" x2="-50" y2="86.6" />
  <line class="line" x1="0" y1="0" x2="50" y2="-86.6" />
  <line class="line" x1="0" y1="0" x2="-50" y2="-86.6" />
  <line class="line" x1="0" y1="0" x2="86.6" y2="-50" />
  <line class="line" x1="0" y1="0" x2="-86.6" y2="-50" />
</svg>
