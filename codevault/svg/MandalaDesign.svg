<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <!-- Define the center of the mandala -->
  <defs>
    <g id="petal">
      <!-- Create a single petal shape -->
      <path d="M 0 0 L 100 0 A 100 100 0 0 1 50 86.6 L 0 0 Z" fill="#00FFFF" fill-opacity="0.5"/>
      <path d="M 0 0 L 100 0 A 100 100 0 0 1 50 86.6 L 0 0 Z" fill="#FF00FF" fill-opacity="0.5" transform="rotate(180 50 0)"/>
    </g>
  </defs>
  <!-- Create 12 symmetrical petals radiating from the center -->
  <g transform="translate(400 400)">
    <use xlink:href="#petal" transform="rotate(0)"/>
    <use xlink:href="#petal" transform="rotate(30)"/>
    <use xlink:href="#petal" transform="rotate(60)"/>
    <use xlink:href="#petal" transform="rotate(90)"/>
    <use xlink:href="#petal" transform="rotate(120)"/>
    <use xlink:href="#petal" transform="rotate(150)"/>
    <use xlink:href="#petal" transform="rotate(180)"/>
    <use xlink:href="#petal" transform="rotate(210)"/>
    <use xlink:href="#petal" transform="rotate(240)"/>
    <use xlink:href="#petal" transform="rotate(270)"/>
    <use xlink:href="#petal" transform="rotate(300)"/>
    <use xlink:href="#petal" transform="rotate(330)"/>
  </g>
  <!-- Add a circle at the center of the mandala -->
  <circle cx="400" cy="400" r="20" fill="#FFFFFF"/>
</svg>
