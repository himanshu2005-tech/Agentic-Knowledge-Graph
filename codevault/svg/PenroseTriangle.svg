<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <!-- Define linear gradients for lighting and shadow effects -->
  <defs>
    <linearGradient id="light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#333333" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#333333" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <!-- Draw the first bar of the Penrose Triangle -->
  <rect x="150" y="100" width="200" height="50" fill="url(#light)" transform="skewX(30)"/>
  <!-- Draw the second bar of the Penrose Triangle -->
  <rect x="250" y="200" width="200" height="50" fill="url(#shadow)" transform="skewX(-30)"/>
  <!-- Draw the third bar of the Penrose Triangle -->
  <rect x="100" y="250" width="200" height="50" fill="url(#light)" transform="skewX(30)"/>
  <!-- Draw the overlapping parts of the bars to create the illusion -->
  <rect x="200" y="150" width="50" height="50" fill="url(#shadow)" transform="skewX(30)"/>
  <rect x="300" y="250" width="50" height="50" fill="url(#light)" transform="skewX(-30)"/>
  <rect x="150" y="300" width="50" height="50" fill="url(#shadow)" transform="skewX(30)"/>
</svg>
