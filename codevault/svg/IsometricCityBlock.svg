<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <!-- Dark space background -->
  <rect x="0" y="0" width="800" height="600" fill="#2f2f2f" />
  
  <!-- Small white dots for stars -->
  <circle cx="100" cy="100" r="2" fill="#ffffff" />
  <circle cx="200" cy="300" r="2" fill="#ffffff" />
  <circle cx="300" cy="100" r="2" fill="#ffffff" />
  <circle cx="400" cy="400" r="2" fill="#ffffff" />
  <circle cx="500" cy="200" r="2" fill="#ffffff" />
  <circle cx="600" cy="500" r="2" fill="#ffffff" />
  <circle cx="700" cy="300" r="2" fill="#ffffff" />
  
  <!-- Skyscraper 1 -->
  <polygon points="100,200 150,200 125,100" fill="#00ffff" /> <!-- Roof -->
  <polygon points="100,200 150,200 100,300" fill="#add8e6" /> <!-- Left face -->
  <polygon points="150,200 200,200 150,300" fill="#03055b" /> <!-- Right face -->
  
  <!-- Skyscraper 2 -->
  <polygon points="250,250 300,250 275,150" fill="#00ffff" /> <!-- Roof -->
  <polygon points="250,250 300,250 250,350" fill="#add8e6" /> <!-- Left face -->
  <polygon points="300,250 350,250 300,350" fill="#03055b" /> <!-- Right face -->
  
  <!-- Skyscraper 3 -->
  <polygon points="400,300 450,300 425,200" fill="#00ffff" /> <!-- Roof -->
  <polygon points="400,300 450,300 400,400" fill="#add8e6" /> <!-- Left face -->
  <polygon points="450,300 500,300 450,400" fill="#03055b" /> <!-- Right face -->
  
  <!-- Skyscraper 4 -->
  <polygon points="550,350 600,350 575,250" fill="#00ffff" /> <!-- Roof -->
  <polygon points="550,350 600,350 550,450" fill="#add8e6" /> <!-- Left face -->
  <polygon points="600,350 650,350 600,450" fill="#03055b" /> <!-- Right face -->
</svg>
