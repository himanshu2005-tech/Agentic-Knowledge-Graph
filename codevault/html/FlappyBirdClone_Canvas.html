<!-- Auto-generated Code Vault for 'FlappyBirdClone (Canvas)' [Html] -->

<!DOCTYPE html>
<html>
<head>
    <title>Flappy Bird Clone</title>
    <style>
        /* Add some basic styling to our game */
        body {
            margin: 0;
            background-color: #87CEEB; /* Retro blue sky */
        }
        #game-container {
            width: 400px;
            height: 600px;
            border: 1px solid black;
            margin: 50px auto;
        }
        #game-over-screen {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas" width="400" height="600"></canvas>
        <div id="game-over-screen">
            <h1>Game Over!</h1>
            <p>Score: <span id="final-score"></span></p>
            <button id="restart-button">Restart</button>
        </div>
    </div>

    <script>
        // Get the canvas element
        var canvas = document.getElementById('game-canvas');
        var ctx = canvas.getContext('2d');

        // Set the canvas dimensions
        canvas.width = 400;
        canvas.height = 600;

        // Define some constants
        var GRAVITY = 0.2;
        var BIRD_SIZE = 30;
        var PIPE_WIDTH = 80;
        var PIPE_GAP = 150;
        var PIPE_SPEED = 2;
        var JUMP_HEIGHT = -6;

        // Define the bird object
        var bird = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            vy: 0,
            size: BIRD_SIZE
        };

        // Define the pipe objects
        var pipes = [];

        // Define the score
        var score = 0;

        // Define the game over flag
        var gameOver = false;

        // Main game loop
        function update() {
            if (!gameOver) {
                // Update the bird position
                bird.vy += GRAVITY;
                bird.y += bird.vy;

                // Check for collision with the ground
                if (bird.y + bird.size > canvas.height) {
                    bird.y = canvas.height - bird.size;
                    gameOver = true;
                }

                // Update the pipes
                for (var i = 0; i < pipes.length; i++) {
                    pipes[i].x -= PIPE_SPEED;

                    // Check for collision with the bird
                    if (checkCollision(bird, pipes[i])) {
                        gameOver = true;
                    }

                    // Check if the pipe is off the screen
                    if (pipes[i].x < -PIPE_WIDTH) {
                        pipes.splice(i, 1);
                    }
                }

                // Add new pipes
                if (Math.random() < 0.01) {
                    var pipeY = Math.random() * (canvas.height - PIPE_GAP);
                    pipes.push({
                        x: canvas.width,
                        y: pipeY,
                        width: PIPE_WIDTH,
                        height: canvas.height - pipeY - PIPE_GAP
                    });
                }

                // Update the score
                score++;
            }
        }

        // Draw the game
        function draw() {
            // Clear the canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw the bird
            ctx.fillStyle = 'yellow';
            ctx.fillRect(bird.x, bird.y, bird.size, bird.size);

            // Draw the pipes
            for (var i = 0; i < pipes.length; i++) {
                ctx.fillStyle = 'green';
                ctx.fillRect(pipes[i].x, 0, pipes[i].width, pipes[i].y);
                ctx.fillRect(pipes[i].x, pipes[i].y + PIPE_GAP, pipes[i].width, canvas.height - pipes[i].y - PIPE_GAP);
            }

            // Draw the score
            ctx.font = '24px Arial';
            ctx.fillStyle = 'black';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText('Score: ' + score, 10, 10);

            // Draw the game over screen
            if (gameOver) {
                document.getElementById('game-over-screen').style.display = 'block';
                document.getElementById('final-score').innerText = score;
            }
        }

        // Check for collision between the bird and a pipe
        function checkCollision(bird, pipe) {
            if (bird.x + bird.size > pipe.x && bird.x < pipe.x + pipe.width) {
                if (bird.y < pipe.y || bird.y + bird.size > pipe.y + PIPE_GAP) {
                    return true;
                }
            }
            return false;
        }

        // Handle key presses
        document.addEventListener('keydown', function(event) {
            if (event.key === ' ') {
                bird.vy = JUMP_HEIGHT;
            }
        });

        // Handle restart button click
        document.getElementById('restart-button').addEventListener('click', function() {
            // Reset the game state
            bird.x = canvas.width / 2;
            bird.y = canvas.height / 2;
            bird.vy = 0;
            pipes = [];
            score = 0;
            gameOver = false;

            // Hide the game over screen
            document.getElementById('game-over-screen').style.display = 'none';
        });

        // Main game loop
        setInterval(function() {
            update();
            draw();
        }, 16);
    </script>
</body>
</html>
